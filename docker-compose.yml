# Full stack behind one entry point:  http://localhost:8080
#
#   browser ──► gateway (nginx :80) ──┬── /        → built SPA (static)
#                                     └── /api/*   → backend (Express :3000) ──► db (Postgres :5432)
#
# API docs (Swagger UI): http://localhost:8080/api/docs/
#
# `docker compose up -d db` still starts only the database for local
# development (Vite on :5173 + `npm run dev` in backend/).

services:
  db:
    image: postgres:16
    container_name: asset-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: asset_app
      POSTGRES_PASSWORD: asset_app_dev
    ports:
      # Override when 5432 is taken (e.g. a native PostgreSQL): DB_HOST_PORT=55432
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_app -d asset_management"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: asset-management-backend
    restart: unless-stopped
    environment:
      # This stack is the local HTTP entry point (http://localhost:8080), so it
      # runs in development mode. A real deployment must override NODE_ENV to
      # production together with a real CSRF_SECRET, COOKIE_SECURE=true and
      # https ALLOWED_ORIGINS.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: asset_management
      DB_USER: asset_app
      DB_PASSWORD: asset_app_dev
      # The browser reaches the SPA and the API through the gateway origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Override with a random value of at least 32 characters in any deployment.
      CSRF_SECRET: ${CSRF_SECRET:-local-development-csrf-secret-change-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-1800}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-43200}
    # Not published: only the gateway reaches the API.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: asset-management-gateway
    restart: unless-stopped
    environment:
      API_UPSTREAM: backend:3000
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
